paper_configuration:
  backbones:
  - wav2vec 2.0 Base
  - DistilBERT-base-uncased
  audio_sampling_hz: 16000
  max_text_wordpieces: 128
  batch_size: 8
  optimizer: AdamW
  encoder_learning_rate: 1.0e-05
  new_layers_learning_rate: 0.0001
  warmup_fraction: 0.1
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  max_epochs: 20
  early_stopping_patience: 3
  dropout: 0.2
  training_seeds:
  - 13
  - 29
  - 47
  lambda_emo: 1.0
  lambda_reg: 0.5
  development_split:
    train_percent: 80
    validation_percent: 10
    calibration_percent: 10
    dialog_disjoint: true
  reported_hardware:
    gpu: NVIDIA RTX 4090
    cpu: Intel Xeon Gold 6230
    ram_gb: 32
    cuda: '11.8'
    cudnn: 8.7.0
excluded_stale_repository_sections:
