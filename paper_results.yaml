# DERS-X paper-aligned result registry
# Generated only from values explicitly reported in the uploaded manuscript.
# IMPORTANT: individual values for the 10 LOSO speaker folds are not reported in the manuscript and are not fabricated here.

metadata:
  title: A Reproducible Benchmark Protocol for Calibrated Multimodal Proxy-Distress
    Affect Modeling on Speech Corpora
  model: DERS-X
  alignment_target: uploaded manuscript
  evaluation_protocol: leave-one-speaker-out (LOSO)
  held_out_unit: individual IEMOCAP speaker
  n_primary_folds: 10
  iemocap_analytic_utterances: 5479
  msp_podcast_retained_utterances: 24500
  warning: The manuscript does not report the 10 individual per-speaker fold rows.
    This registry therefore stores only values explicitly reported in the manuscript
    and does not fabricate missing fold-level results.
