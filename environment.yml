name: dersx_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.0.0
  - torchaudio=2.0.0
  - numpy=1.24.0
  - pandas=2.0.0
  - scipy=1.10.0
  - scikit-learn=1.3.0
  - matplotlib=3.7.0
  - tqdm=4.66.0
  - pip
  - pip:
      - "transformers>=4.42,<5"
      - "datasets>=2.12"
      - "captum>=0.6"
      - "librosa>=0.10"
      - "soundfile>=0.12"
      - "pyyaml>=6.0"
      - "psutil>=5.9"
      - "pyarrow>=14"
